@if (modalService.isOpen()) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-container" [class]="'modal-' + modalService.config()!.type">
      <!-- Modal Header -->
      <div class="modal-header">
        <h3 class="modal-title">
          @if (modalService.config()!.type === 'danger') {
            <span class="modal-icon">⚠️</span>
          } @else if (modalService.config()!.type === 'warning') {
            <span class="modal-icon">⚡</span>
          } @else {
            <span class="modal-icon">ℹ️</span>
          }
          {{ modalService.config()!.title }}
        </h3>
        <button type="button" class="modal-close" (click)="onCancel()" aria-label="Close">
          ✕
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <p class="modal-message">{{ modalService.config()!.message }}</p>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-cancel" (click)="onCancel()">
          {{ modalService.config()!.cancelText }}
        </button>
        <button
          type="button"
          class="btn btn-confirm"
          [class.btn-danger]="modalService.config()!.type === 'danger'"
          (click)="onConfirm()">
          {{ modalService.config()!.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
